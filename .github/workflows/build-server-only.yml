name: Build Server Only

# Только серверный плагин (Cef.so / Cef.dll для open.mp), без сборки клиента CEF.
# Запуск: Actions -> Build Server Only -> Run workflow. Готовые файлы - внизу страницы запуска, в Artifacts:
#   server-ServerOmp-x86-Linux   -> Cef.so (32 бита, обычный open.mp сервер под Linux)
#   server-ServerOmp-x64-Linux   -> Cef.so (64 бита)
#   server-ServerOmp-x86-Windows -> Cef.dll

on:
  workflow_dispatch:

jobs:
  build-server:
    name: Build Server (${{ matrix.target }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ServerOmp
            arch: x86
          - target: ServerOmp
            arch: x64
    uses: ./.github/workflows/build-server-reusable.yml
    with:
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      build-type: Release
